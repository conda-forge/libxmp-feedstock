context:
  version: "4.7.1"

package:
  name: libxmp
  version: ${{ version }}

source:
  url: https://github.com/libxmp/libxmp/releases/download/libxmp-${{ version }}/libxmp-${{ version }}.tar.gz
  sha256: 398052ddff91472e9939240422d10b92149a1f5b80d2455ff5dde129f10c28e5

build:
  number: 0
  script: build

requirements:
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    - cmake
    - ninja
  run_exports:
    - ${{ pin_subpackage("libxmp", upper_bound="x") }}

tests:
  - package_contents:
      include:
        - xmp.h
      lib:
        # windows uses unix naming
        - if: unix
          then: xmp
          else: libxmp

about:
  homepage: https://github.com/libxmp/libxmp
  summary: 'Libxmp is a library that renders module files to PCM data.'
  license: MIT
  license_file: LICENSE.txt
  repository: https://github.com/libxmp/libxmp

extra:
  recipe-maintainers:
    - h-vetinari
